{{define "login"}}
<div class="card login-box">
    <h1>S3lytics</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Enter your S3-compatible storage credentials</p>

    {{if .Error}}
    <div class="error-message">{{.Error}}</div>
    {{end}}

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="endpoint">S3 Endpoint URL</label>
            <input type="url" id="endpoint" name="endpoint" required placeholder="https://s3.cubbit.eu">
            <span class="form-help">The S3-compatible endpoint URL</span>
        </div>

        <div class="form-group">
            <label for="region">Region <span class="form-help">(optional, defaults to us-east-1)</span></label>
            <input type="text" id="region" name="region" placeholder="us-east-1">
        </div>

        <div class="form-group">
            <label for="access_key">Access Key</label>
            <input type="text" id="access_key" name="access_key" required>
        </div>

        <div class="form-group">
            <label for="secret_key">Secret Key</label>
            <input type="password" id="secret_key" name="secret_key" required>
        </div>

        <button type="submit" class="btn" style="width:100%;">Connect</button>
    </form>
</div>
{{end}}
