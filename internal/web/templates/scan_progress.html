{{define "scan_progress"}}
<div class="card fade-in" id="progress-container" hx-get="/scan/{{.ScanID}}/progress" hx-trigger="every 2s" hx-swap="outerHTML">
    <h2>{{.Bucket}}</h2>
    <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:var(--space-20);">Scan in progress</p>

    <div style="margin-bottom:var(--space-20);">
        <div class="progress-bar">
            <div class="progress-bar-fill" style="width: {{.ProgressPct}}%;"></div>
        </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-16);text-align:center;">
        <div>
            <div style="font-size:2.25rem;font-weight:700;color:var(--primary);">{{.ObjectsFound}}</div>
            <div style="font-size:0.875rem;color:var(--text-muted);margin-top:var(--space-4);">Objects Found</div>
        </div>
        <div>
            <div style="font-size:2.25rem;font-weight:700;color:#FFFFFF;">{{.Elapsed}}</div>
            <div style="font-size:0.875rem;color:var(--text-muted);margin-top:var(--space-4);">Elapsed</div>
        </div>
        <div>
            <div style="font-size:2.25rem;font-weight:700;color:#FFFFFF;text-transform:capitalize;">{{.ScanType}}</div>
            <div style="font-size:0.875rem;color:var(--text-muted);margin-top:var(--space-4);">Scan Type</div>
        </div>
    </div>

    <div style="margin-top:var(--space-16);text-align:center;">
        <span style="color:var(--grey-300);font-size:0.875rem;">
            {{if .Status}}{{.Status}}{{else}}Running...{{end}}
            <span class="spinner" style="vertical-align:middle;margin-left:var(--space-8);"></span>
        </span>
    </div>
</div>
{{end}}
